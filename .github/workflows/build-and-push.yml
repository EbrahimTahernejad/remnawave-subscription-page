name: Build hwid image

on:
  push:
    tags:
      - '*'

  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: remnawave/subscription-page:hwid
  ARCHIVE: subscription-page-hwid.tar.gz

jobs:
  build:
    name: Build image tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run start:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          load: true

      - name: Save image
        run: docker save "$IMAGE" | gzip > "$ARCHIVE"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="hwid-${{ github.run_number }}"
          fi
          gh release create "$TAG" "$ARCHIVE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "Docker image \`$IMAGE\` (linux/amd64). Load with: \`gunzip -c $ARCHIVE | docker load\`"
